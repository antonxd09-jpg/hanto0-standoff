name: Build APK
on: [push, workflow_dispatch]
permissions: { contents: write }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: nttld/setup-ndk@v1
        with: { ndk-version: r26d }

      - name: Build libnl_menu.so
        run: |
          cd src
          sed -i 's/add_executable(menu_smoke/add_library(menu_smoke SHARED/' CMakeLists.txt
          sed -i 's/add_library(durow_menu STATIC/add_library(durow_menu SHARED/' CMakeLists.txt
          sed -i 's/add_library(durow_menu /add_library(durow_menu SHARED /' CMakeLists.txt
          rm -rf build && mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON ..
          make -j$(nproc)
          find . -name "*.so" | head -n 1 | xargs -I {} cp {} $GITHUB_WORKSPACE/libnl_menu.so

      - name: Build Injector
        run: |
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang -O2 injector.c -o injector -static

      - name: Compile APK
        run: |
          mkdir -p app/assets
          cp $GITHUB_WORKSPACE/libnl_menu.so app/assets/
          cp $GITHUB_WORKSPACE/injector app/assets/
          cp -r src/assets/* app/assets/ 2>/dev/null || true
          
          echo '<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.hanto0.standoff">
              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="33" />
              <application android:label="Hanto0">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>' > app/AndroidManifest.xml
          
          mkdir -p app/res/values
          echo '<resources><string name="app_name">Hanto0</string></resources>' > app/res/values/strings.xml
          
          cd app
          javac -source 8 -target 8 -cp $ANDROID_HOME/platforms/android-34/android.jar -d obj src/com/hanto0/standoff/*.java
          $ANDROID_HOME/build-tools/34.0.0/d8 --output . obj/com/hanto0/standoff/*.class
          $ANDROID_HOME/build-tools/34.0.0/aapt package -f -M AndroidManifest.xml -S res -A assets -I $ANDROID_HOME/platforms/android-34/android.jar -F unsigned.apk
          zip -q -0 unsigned.apk classes.dex
          $ANDROID_HOME/build-tools/34.0.0/zipalign -f 4 unsigned.apk aligned.apk
          keytool -genkey -v -keystore k.keystore -alias h -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=H" > /dev/null 2>&1
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks k.keystore --ks-pass pass:123456 --out hanto0-standoff.apk aligned.apk

      - name: Upload APK to Repo
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          cp app/hanto0-standoff.apk ./hanto0-standoff.apk
          git add hanto0-standoff.apk
          git commit -m "auto: compiled APK with real injector and logs" || exit 0
          git push

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with: { name: Hanto0-APK, path: app/hanto0-standoff.apk }
