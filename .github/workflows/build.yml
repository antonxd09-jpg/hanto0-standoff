name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'zulu' }
      
    - name: Setup NDK r21e
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with: { ndk-version: r21e, add-to-path: false }
      
    - name: Patch Dobby (Bulletproof Perl)
      run: |
        rm -rf app/src/main/cpp/Dobby
        git clone https://github.com/jmpews/Dobby.git app/src/main/cpp/Dobby
        find app/src/main/cpp/Dobby -name "*.S" -type f -exec perl -pi -e 's/(\w+)@PAGEOFF/:lo12:$1/g' {} +
        find app/src/main/cpp/Dobby -name "*.S" -type f -exec perl -pi -e 's/@PAGE//g' {} +
        echo "=== PATCH APPLIED ==="

    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew clean assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HantoO-APK
        path: app/build/outputs/apk/debug/app-debug.apk
