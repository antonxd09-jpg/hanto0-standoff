name: Build HantoO APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Native Astra Lib
        run: |
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | head -n 1)
          if [ -z "$NDK_DIR" ]; then
            NDK_DIR=$ANDROID_NDK_HOME
          fi
          echo "Используем NDK: $NDK_DIR"
          
          $NDK_DIR/ndk-build -C app/src/main/cpp/Astra
          mkdir -p app/src/main/assets
          cp app/src/main/cpp/Astra/libs/arm64-v8a/libastra.so app/src/main/assets/libastra.so

      - name: Build APK
        run: |
          chmod +x gradlew || true
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hanto-apk
          path: app/build/outputs/apk/debug/*.apk
