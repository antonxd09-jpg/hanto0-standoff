name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'zulu' }
      
    - name: Setup NDK r21e
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with: { ndk-version: r21e, add-to-path: false }
      
    - name: Patch Dobby
      run: |
        rm -rf app/src/main/cpp/Dobby
        git clone https://github.com/jmpews/Dobby.git app/src/main/cpp/Dobby
        cat << 'PYEOF' > patch.py
import os
for root, dirs, files in os.walk('app/src/main/cpp/Dobby'):
    for file in files:
        if file.endswith('.S'):
            path = os.path.join(root, file)
            with open(path, 'r') as f:
                content = f.read()
            content = content.replace('@PAGE', '').replace('@PAGEOFF', ':lo12:')
            with open(path, 'w') as f:
                f.write(content)
print("Dobby patched successfully!")
PYEOF
        python3 patch.py

    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew clean assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HantoO-APK
        path: app/build/outputs/apk/debug/app-debug.apk
