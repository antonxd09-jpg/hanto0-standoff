name: Build HantoO APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: Build Native Astra Lib
        run: |
          $ANDROID_HOME/ndk/25.2.9519653/ndk-build -C app/src/main/cpp/Astra
          cp app/src/main/cpp/Astra/libs/arm64-v8a/libastra.so app/src/main/assets/libastra.so

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hanto-apk
          path: app/build/outputs/apk/debug/*.apk
