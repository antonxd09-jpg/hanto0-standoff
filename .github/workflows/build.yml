name: Build HantoO APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK and NDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;25.2.9519653"

      - name: Build Native Astra Lib
        run: |
          chmod +x $ANDROID_NDK_HOME/ndk-build
          $ANDROID_NDK_HOME/ndk-build -C app/src/main/cpp/Astra
          mkdir -p app/src/main/assets
          cp app/src/main/cpp/Astra/libs/arm64-v8a/libastra.so app/src/main/assets/libastra.so

      - name: Build APK
        run: |
          chmod +x gradlew || true
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hanto-apk
          path: app/build/outputs/apk/debug/*.apk
