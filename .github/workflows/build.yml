name: Build LemmingRMT APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Find and Compile C++ Cheat
        run: |
          # Ищем файл сборки CMakeLists.txt в локальной папке
          CMAKE_FILE=$(find LemmingRMT_src -name "CMakeLists.txt" | head -n 1)
          
          if [ -n "$CMAKE_FILE" ]; then
            echo "Найден CMakeLists.txt по пути: $CMAKE_FILE"
            cd $(dirname "$CMAKE_FILE")
            mkdir -p build && cd build
            cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26
            make -j4
          else
            echo "CMakeLists.txt не найден! Проверь структуру папок."
            exit 1
          fi

      - name: Copy Compiled .so to APK
        run: |
          # Ищем скомпилированный .so файл
          SO_FILE=$(find LemmingRMT_src -name "*.so" | head -n 1)
          
          if [ -n "$SO_FILE" ]; then
            echo "Найден скомпилированный файл: $SO_FILE"
            mkdir -p app/src/main/assets
            cp "$SO_FILE" app/src/main/assets/libmain.so
          else
            echo "Скомпилированный .so не найден! Ошибка сборки C++."
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HantoO-RMT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
