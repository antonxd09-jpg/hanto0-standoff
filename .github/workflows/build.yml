name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'zulu' }
    
    - name: Setup NDK r21e
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r21e
        add-to-path: false

    - name: Download Dobby
      run: |
        git clone https://github.com/jmpews/Dobby.git Dobby
        cd Dobby
        mkdir build && cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21
        make -j4
        cd ../..
        mkdir -p app/src/main/cpp/Dobby
        cp -r Dobby/include app/src/main/cpp/Dobby/
        mkdir -p app/src/main/cpp/Dobby/built/include
        cp -r Dobby/built/include/* app/src/main/cpp/Dobby/built/include/ || true

    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HantoO-APK
        path: app/build/outputs/apk/debug/app-debug.apk
