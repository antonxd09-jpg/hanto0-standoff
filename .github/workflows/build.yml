name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'zulu' }
      
    - name: Setup NDK r21e
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with: { ndk-version: r21e, add-to-path: false }
      
    - name: Patch Dobby
      run: |
        rm -rf app/src/main/cpp/Dobby
        git clone https://github.com/jmpews/Dobby.git app/src/main/cpp/Dobby
        
        cat << 'PYEOF' > patch.py
        import os, re
        for root, dirs, files in os.walk('app/src/main/cpp/Dobby'):
            for file in files:
                if file.endswith('.S'):
                    p = os.path.join(root, file)
                    with open(p, 'r') as f:
                        text = f.read()
                    text = text.replace('@PAGEOFF', ':lo12:')
                    text = text.replace('@PAGE', '')
                    text = re.sub(r'([a-zA-Z0-9_]+):lo12:', r':lo12:\1', text)
                    with open(p, 'w') as f:
                        f.write(text)
        print("Patched successfully!")
        PYEOF
        
        python3 patch.py
        
        echo "=== CHECKING PATCH ==="
        sed -n '50,56p' app/src/main/cpp/Dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.S

    - name: Build APK
      run: |
        chmod +x gradlew
        rm -rf app/.cxx
        ./gradlew clean assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HantoO-APK
        path: app/build/outputs/apk/debug/app-debug.apk
