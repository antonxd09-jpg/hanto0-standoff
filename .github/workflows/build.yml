name: Build APK with Internal Cheat
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
      - name: Compile Cheat C++
        run: |
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++ \
            -shared -fPIC -O2 main.cpp \
            And64InlineHook/And64InlineHook.cpp \
            imgui/imgui.cpp imgui/imgui_draw.cpp imgui/imgui_tables.cpp imgui/imgui_widgets.cpp \
            imgui/backends/imgui_impl_opengl3.cpp \
            -I./ -I./imgui -I./imgui/backends -I./And64InlineHook \
            -lEGL -lGLESv3 -llog -ldl \
            -o libmain.so
          mkdir -p app/src/main/assets
          mv libmain.so app/src/main/assets/libmain.so
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1'
      - name: Build APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HantoO-Internal-APK
          path: app/build/outputs/apk/debug/app-debug.apk
