<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GHOST_PROTOCOL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="ui-layer">
            <div class="stat" id="score-display">DATA: 0</div>
            <div class="stat" id="combo-display">COMBO: x0</div>
            <div class="stat" id="lives-display">SYS: [💚💚💚]</div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="start-screen">
            <h1 class="glitch" data-text="GHOST_PROTOCOL">GHOST_PROTOCOL</h1>
            <p>TAP THE NODES WHEN THE RING CLOSES.</p>
            <button id="start-btn">INITIALIZE</button>
        </div>
        <div id="game-over" class="hidden">
            <h1 class="glitch" data-text="SYSTEM HALTED">SYSTEM HALTED</h1>
            <p>DATA HARVESTED: <span id="final-score">0</span></p>
            <button id="restart-btn">REBOOT</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
