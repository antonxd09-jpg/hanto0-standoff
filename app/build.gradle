apply plugin: 'com.android.application'
android {
    namespace 'com.exodium.launcher'
    compileSdk 34
    defaultConfig {
        applicationId "com.exodium.launcher.internal"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    aaptOptions {
        noCompress "sh", "so", "cache"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {}
