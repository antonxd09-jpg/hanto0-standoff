plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hanto0.loader'
    compileSdk 34
    ndkVersion '25.2.9519653'

    defaultConfig {
        applicationId 'com.hanto0.loader'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '2.4.1'
        ndk { abiFilters 'arm64-v8a' }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging = true }
    }
}

dependencies {
}
