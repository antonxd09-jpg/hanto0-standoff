plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hanto.client'
    compileSdk 33
    ndkVersion "21.4.7075529"
    
    defaultConfig {
        applicationId "com.hanto.client"
        minSdk 24
        targetSdk 33
        externalNativeBuild { 
            cmake { 
                cppFlags "-std=c++17 -fno-exceptions -fno-rtti" 
            } 
        }
        ndk { 
            abiFilters 'arm64-v8a' 
        }
    }
    
    externalNativeBuild { 
        cmake { 
            path "src/main/cpp/CMakeLists.txt" 
        } 
    }
    
    packagingOptions { 
        jniLibs { 
            useLegacyPackaging = true 
        } 
    }
}
