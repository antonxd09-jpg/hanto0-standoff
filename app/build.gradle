plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.hanto0.standoff'
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.hanto0.standoff"
        minSdkVersion 26
        targetSdkVersion 33
        versionCode 2
        versionName "2.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
}
